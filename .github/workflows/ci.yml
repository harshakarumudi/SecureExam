name: SecureExam DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Code Quality & AST Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff AST Linter
        run: pip install ruff

      - name: Execute Ruff Code Linting
        run: ruff check backend/ tests/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Validate Frontend TypeScript
        working-directory: frontend
        run: |
          npm ci
          npm run build

  security-audit:
    name: Dependency & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies & pip-audit
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Run pip-audit Vulnerability Scan
        run: pip-audit

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  test-and-coverage:
    name: Automated Unit & Security Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-audit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies & Test Framework
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Test Suite with Coverage
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v --cov=backend.app --cov-report=xml:coverage.xml

      - name: Verify Coverage Threshold (>= 65%)
        run: |
          python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); rate=float(tree.getroot().attrib['line-rate'])*100; print(f'Coverage: {rate:.1f}%'); assert rate >= 65.0, 'Coverage below threshold'"

  container-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: secureexam-backend:latest

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: secureexam-frontend:latest