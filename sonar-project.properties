# SonarQube Configuration for SecureExam
sonar.projectKey=secureexam-academic
sonar.projectName=SecureExam - Secure Online Examination Management System
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source Directories
sonar.sources=backend/app,frontend/src
sonar.tests=tests

# Inclusions and Exclusions
sonar.inclusions=backend/app/**,frontend/src/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/venv/**,**/.pytest_cache/**,**/__pycache__/**

# Python Code Coverage & Testing
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.13

# Quality Gate Configurations
# Zero Vulnerabilities, Zero Security Hotspots unreviewed, Maintainability Rating A, Reliability Rating A
sonar.qualitygate.wait=true