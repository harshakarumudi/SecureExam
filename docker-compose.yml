version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: secureexam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secureuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePass2026_ExamDB}
      POSTGRES_DB: ${POSTGRES_DB:-secureexam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureuser} -d ${POSTGRES_DB:-secureexam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Note: Port 5432 is intentionally unexposed to host to enforce network isolation

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secureexam_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secureuser}:${POSTGRES_PASSWORD:-SuperSecurePass2026_ExamDB}@postgres:5432/${POSTGRES_DB:-secureexam}
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: production
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:8000,http://frontend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-net
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secureexam_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  db-net:
    internal: true
    driver: bridge
  app-net:
    driver: bridge

volumes:
  postgres_data: